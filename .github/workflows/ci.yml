name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff (E, F, W, I, B, C4, SIM)
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Unit tests (no network)
        run: pytest -m "not integration"

  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Byte-compile all sources
        run: python -m compileall -q obscuralens tests test_core.py
      - name: Import smoke test
        run: |
          python -c "import obscuralens, obscuralens.commands, obscuralens.cli, obscuralens.investigate, obscuralens.watchlist, obscuralens.plugins, obscuralens.mcp_server"
          python -m obscuralens --version
      - name: Dependency consistency
        run: pip check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with web extra
        run: pip install -e ".[dev,web]"
      - name: Web API tests
        run: pytest tests/test_web.py

  tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with tui extra
        run: pip install -e ".[dev,tui]"
      - name: TUI tests
        run: pytest tests/test_tui.py

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase the image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop:
    # Focused check for the v5.1 desktop beta surface: the desktop module,
    # i18n catalogues, offline data packs, SDK and rule packs. These are all
    # stdlib(+yaml/jinja2) modules, so the plain dev install suffices.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Desktop beta surface tests
        run: |
          pytest tests/test_desktop.py tests/test_i18n.py tests/test_data_catalog.py \
                 tests/test_sdk.py tests/test_rules.py tests/test_templates.py -q
      - name: Desktop CLI smoke test
        run: |
          python -m obscuralens desktop --diagnostics | head -40
          python -m obscuralens data country US
          python -m obscuralens data port 22
          python -m obscuralens i18n list
          python -m obscuralens data stats

  exe:
    # Best-effort standalone Windows executable; the artifact is uploaded even
    # if a future PyInstaller/hook regression breaks the build.
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with exe extra
        run: pip install ".[exe]"
      - name: Build single-file executable
        run: pyinstaller scripts/obscuralens.spec --noconfirm
      - name: Smoke-test the executable
        run: dist/obscuralens.exe --version
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obscuralens-windows-exe
          path: dist/obscuralens.exe

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Validate package metadata
        run: twine check dist/*
      - name: Install the wheel and smoke-test the CLI
        run: |
          pip install dist/*.whl
          obscuralens --version
          obscuralens plugins list
          obscuralens sources domain
