# ObscuraLens explainable rule pack -- shared
# ---------------------------------------------------------------------------
# YAML schema (v1), identical for every pack in this directory:
#   name: human pack name
#   description: what this pack covers
#   version: pack schema/content version (int)
#   rules:
#     - id: KIND-NNN            # stable identifier, unique within the pack
#       title: short headline
#       description: >-         # WHY the signal matters (1-3 honest sentences)
#         ...
#       severity: info|low|medium|high|critical
#       weight: 0-100           # score contribution when the rule fires
#       tags: [label, ...]      # optional free-form filter labels
#       references:             # real technique/context refs only; omit if unsure
#         - "MITRE ATT&CK T1583.001"
#       enabled: true           # optional, default true
#       conditions:             # ALL must match (AND semantics)
#         - field: dotted.path  # dotted paths walk nested field dicts
#           operator: eq|neq|in|not_in|contains|not_contains|startswith|endswith|
#                     regex|gt|gte|lt|lte|exists|not_exists|empty|not_empty|
#                     is_true|is_false|in_cidr|known_pack|age_lt_days|age_gt_days
#           value: ...          # operator-dependent; ignored by exists/empty ops
#
# The 'shared' pack is kind-agnostic: evaluate_rules() merges it into every
# kind's evaluation so coverage/quality signals apply everywhere.  Fields are
# the flat lookup-result dicts the trackers return; missing fields never match.
# ---------------------------------------------------------------------------

name: shared-rules
description: >-
  Kind-agnostic data-quality and coverage signals that apply to every
  lookup result regardless of target kind.
version: 1
rules:
  - id: SHARED-001
    title: Degraded source coverage
    description: >-
      Four or more sources failed during this lookup. The collected fields
      may be incomplete, so absence of a risk signal here is weak evidence
      rather than an all-clear.
    severity: info
    weight: 5
    tags: [quality, coverage]
    conditions:
      - field: sources_failed_count
        operator: gte
        value: 4

  - id: SHARED-002
    title: No source answered
    description: >-
      Every queried source failed, so the result is empty and any scoring
      on it is meaningless. Re-run later or from another network before
      drawing conclusions.
    severity: medium
    weight: 15
    tags: [quality, coverage]
    conditions:
      - field: sources_ok_count
        operator: eq
        value: 0

  - id: SHARED-003
    title: Lookup reported failure
    description: >-
      The tracker itself flagged the lookup as unsuccessful. The fields
      present are error remnants, not enrichment, and should not be scored
      further.
    severity: low
    weight: 10
    tags: [quality]
    conditions:
      - field: success
        operator: is_false

  - id: SHARED-004
    title: Source timeouts observed
    description: >-
      At least one source timed out. Timeouts often hide rate limits or
      temporary outages, which biases the merged result toward whichever
      sources happened to answer fastest.
    severity: info
    weight: 5
    tags: [quality, reliability]
    conditions:
      - field: errors
        operator: contains
        value: timeout

  - id: SHARED-005
    title: Thin enrichment
    description: >-
      Two or fewer fields came back from every source combined. With so
      little data the absence of further signals says almost nothing about
      the target.
    severity: low
    weight: 10
    tags: [quality, coverage]
    conditions:
      - field: field_count
        operator: lte
        value: 2

  - id: SHARED-006
    title: No provenance recorded
    description: >-
      The result carries no per-field source attribution. Without
      provenance an analyst cannot tell which source vouches for which
      value, weakening every downstream conclusion.
    severity: info
    weight: 5
    tags: [quality, provenance]
    conditions:
      - field: field_sources
        operator: not_exists

  - id: SHARED-007
    title: Stale last-seen stamp
    description: >-
      The newest activity timestamp is more than a year old. Reputation
      signals decay quickly, so blocklist and sighting data this old should
      be re-verified before it drives a decision.
    severity: info
    weight: 5
    tags: [freshness]
    conditions:
      - field: last_seen
        operator: age_gt_days
        value: 365

  - id: SHARED-008
    title: Partial source failure
    description: >-
      At least one source failed while others answered. This is routine in
      multi-source lookups and is recorded for transparency; it only
      becomes interesting when combined with SHARED-001.
    severity: info
    weight: 0
    tags: [quality, coverage]
    conditions:
      - field: sources_failed_count
        operator: gte
        value: 1

  - id: SHARED-009
    title: Broad multi-source agreement
    description: >-
      Five or more sources answered successfully. Agreement across many
      independent sources makes the collected fields comparatively
      trustworthy; this is a positive context signal, not a risk.
    severity: info
    weight: 0
    tags: [quality, positive]
    conditions:
      - field: sources_ok_count
        operator: gte
        value: 5

  - id: SHARED-010
    title: Rate limiting observed
    description: >-
      At least one source answered with a rate-limit error. The merged
      result may silently miss that source's fields for this run; retry
      after the window resets if those fields matter.
    severity: info
    weight: 5
    tags: [quality, reliability]
    conditions:
      - field: errors
        operator: contains
        value: rate

  - id: SHARED-011
    title: Clean run
    description: >-
      No errors were recorded for this lookup. Combined with broad source
      coverage this supports treating absence of signals as meaningful
      rather than a data gap.
    severity: info
    weight: 0
    tags: [quality, positive]
    conditions:
      - field: errors
        operator: empty
        value: true
