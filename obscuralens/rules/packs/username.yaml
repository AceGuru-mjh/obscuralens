# ObscuraLens explainable rule pack -- username
# ---------------------------------------------------------------------------
# YAML schema (v1), identical for every pack in this directory:
#   name / description / version, then rules: each with id, title,
#   description (why it matters), severity, weight, tags, references and
#   conditions (ALL must match). See packs/shared.yaml for the full
#   annotated schema and the operator list.
# Username results are FLAT field dicts (no 'info' wrapper): found_count,
# not_found_count, unknown_count, total_checked, confirmed_platforms...
# NOTE: username rules describe an *exposure profile*, not a risk verdict
# about a person -- the descriptions stay honest about that framing.
# ---------------------------------------------------------------------------

name: username-rules
description: >-
  Explainable footprint and platform-mix signals for username sweeps;
  framed as exposure breadth, never as statements about a person.
version: 1
rules:
  - id: USERNAME-001
    title: Broad platform footprint
    description: >-
      The handle is confirmed on ten or more platforms. A wide footprint
      simply means the name is in active public use; it is the baseline
      fact that makes every other username signal interpretable.
    severity: low
    weight: 10
    tags: [footprint]
    conditions:
      - field: found_count
        operator: gte
        value: 10

  - id: USERNAME-002
    title: Confirmed on trading platforms
    description: >-
      The handle matches accounts on trading or crypto exchanges. Public
      trader personas are common, but in fraud triage the same handle on
      market venues is the classic bridge between a social identity and
      wallet-level attribution.
    severity: info
    weight: 5
    tags: [crypto, platforms]
    conditions:
      - field: confirmed_categories
        operator: contains
        value: trading

  - id: USERNAME-003
    title: Present everywhere checked
    description: >-
      Every platform that answered confirmed the handle. Near-universal
      presence usually means either a long-established name or deliberate
      brand squatting across platforms; compare profile ages to tell them
      apart.
    severity: info
    weight: 5
    tags: [footprint]
    conditions:
      - field: not_found_count
        operator: eq
        value: 0
      - field: found_count
        operator: gte
        value: 3

  - id: USERNAME-004
    title: Autogenerated-looking handle
    description: >-
      The name matches common bulk-registration patterns such as
      word+digits. Sock-puppet farms and bot nets generate names this way,
      although plenty of real users picked similar names by chance.
    severity: info
    weight: 5
    tags: [pattern, bots]
    conditions:
      - field: username
        operator: regex
        value: '^[a-z]+[._-]?[0-9]{3,}$'

  - id: USERNAME-005
    title: No confirmed accounts
    description: >-
      The handle was not confirmed anywhere. Either the name is genuinely
      unused or it is deliberately non-standard on purpose; nothing here
      suggests risk, and the sweep is best treated as inconclusive.
    severity: info
    weight: 0
    tags: [footprint]
    conditions:
      - field: found_count
        operator: eq
        value: 0

  - id: USERNAME-006
    title: Many inconclusive checks
    description: >-
      Twenty or more platforms could not give a definitive answer. Heavy
      inconclusive results usually mean rate limits or anti-scraping
      pages, so the absence of confirmations is weaker than it looks.
    severity: info
    weight: 5
    tags: [coverage]
    conditions:
      - field: unknown_count
        operator: gte
        value: 20

  - id: USERNAME-007
    title: Profile keywords mention crypto
    description: >-
      Collected profile fields mention cryptocurrency keywords. Combined
      with trading-platform confirmations this often marks a publicly
      self-identified trader persona rather than anything covert.
    severity: info
    weight: 5
    tags: [crypto, profile]
    conditions:
      - field: profile_keywords
        operator: contains
        value: crypto

  - id: USERNAME-008
    title: Partial platform sweep
    description: >-
      Ten or fewer platforms were checked. The footprint may hide behind
      the platforms that were not queried, so treat misses as unknown
      rather than absent.
    severity: info
    weight: 5
    tags: [coverage]
    conditions:
      - field: total_checked
        operator: lte
        value: 10

  - id: USERNAME-009
    title: Youngest profile is weeks old
    description: >-
      The earliest confirmed sighting is under 90 days old. Newly created
      matching profiles fit both a genuine new user and a fresh
      impersonation -- compare content and follower history on the
      oldest profiles.
    severity: info
    weight: 5
    tags: [age]
    conditions:
      - field: first_seen
        operator: age_lt_days
        value: 90

  - id: USERNAME-010
    title: Rich profile data harvested
    description: >-
      Thirty or more distinct profile fields were collected. The volume
      itself is neutral, but it materially raises re-identification
      risk when this data is later combined with other kinds.
    severity: info
    weight: 5
    tags: [privacy]
    conditions:
      - field: total_fields
        operator: gte
        value: 30
