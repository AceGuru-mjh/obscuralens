[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "obscuralens"
version = "3.1.0"
description = "Multi-source OSINT console for IPs, phone numbers, usernames, emails and domains"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "MJH" }]
keywords = ["osint", "security", "reconnaissance", "ip", "email", "username", "domain"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Internet",
]
dependencies = [
    "requests>=2.28.0",
    "phonenumbers>=8.13.0",
    "PyYAML>=6.0",
    "tabulate>=0.9.0",
    "jinja2>=3.1.0",
    "matplotlib>=3.6.0",
    "numpy>=1.23.0",
    "wordcloud>=1.8.0",
    "reportlab>=3.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "build>=1.0",
    "twine>=5.0",
    "httpx>=0.27",
]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
tui = [
    "textual>=0.60",
]
exe = [
    "pyinstaller>=6.0",
]

[project.scripts]
obscuralens = "obscuralens.cli:main"

[project.urls]
Homepage = "https://github.com/AceGuru-mjh/obscuralens"
Repository = "https://github.com/AceGuru-mjh/obscuralens"

[tool.setuptools.packages.find]
include = ["obscuralens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration' -q"
markers = [
    "integration: tests that hit real network services (run with -m integration)",
]

[tool.ruff]
line-length = 110
target-version = "py39"
extend-exclude = ["_*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "SIM"]
ignore = ["E501"]
