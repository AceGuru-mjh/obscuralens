# ObscuraLens configuration (non-sensitive settings)
# API keys go in secrets.yaml or OBSCURALENS_* environment variables.

api: {}

database:
  db_type: sqlite
  sqlite_path: data/obscuralens.db
  db_host: localhost
  db_port: 5432
  db_name: obscuralens
  db_user: ''
  db_password: ''

app:
  debug: false
  log_level: INFO
  output_format: table
  save_history: true
  max_history_entries: 1000
  request_timeout: 30
  # user_agent defaults to "ObscuraLens/<version>" and tracks __version__
  # automatically. Set it here only to override (e.g. a contact address).
  deep_username_scan: true
  parallel_sources: true
  max_workers: 12
  requests_per_second: 8      # per-host rate limit; 0 disables throttling
  cache_enabled: true         # cache successful HTTP GET responses
  cache_ttl: 900              # seconds a cached response stays fresh
  cache_path: data/http_cache.db
  proxy: ''                   # e.g. http://127.0.0.1:8080
  enable_plugins: true        # load extra sources from plugins/ folders
  disabled_sources: []        # e.g. [rdap, gravatar, internetdb]
  report_dir: reports
  chart_dir: reports/charts
